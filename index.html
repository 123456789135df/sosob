<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>소분소분 2기 지원서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2F1E6;
    --paper-2:#EAE7D6;
    --ink:#232A20;
    --ink-soft:#5B6355;
    --forest:#33452E;
    --forest-2:#4B6142;
    --butter:#EFB525;
    --berry:#AE3B3F;
    --sage:#D9DFC7;
    --line: rgba(35,42,32,0.18);
    --radius:3px;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    line-height:1.6;
  }
  ::selection{ background:var(--butter); color:var(--ink); }

  header.site{
    padding:48px 24px 28px;
    border-bottom:2px dashed var(--line);
  }
  .wrap{ max-width:640px; margin:0 auto; padding:0 24px; }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--forest-2); display:flex; align-items:center; gap:8px; margin-bottom:12px;
  }
  .eyebrow::before{ content:""; width:8px;height:8px;background:var(--berry);border-radius:50%; }
  h1.brand{
    font-family:'Gowun Batang', serif; font-weight:700;
    font-size:clamp(32px,6vw,48px); margin:0 0 8px; color:var(--forest);
  }
  header .sub{ color:var(--ink-soft); font-size:15px; max-width:480px; }
  nav.top a{
    font-family:'IBM Plex Mono', monospace; font-size:13px; text-decoration:none;
    border-bottom:1px solid var(--ink); padding-bottom:2px;
  }

  main{ padding:44px 0 80px; }

  /* ---- receipt-style form card ---- */
  .receipt{
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:36px 32px 32px;
    box-shadow:0 18px 30px rgba(35,42,32,.08);
    position:relative;
  }
  .receipt::before{
    content:"";
    position:absolute; top:-10px; left:0; right:0; height:10px;
    background:
      linear-gradient(-45deg, transparent 6px, #fff 6px) 0 0/12px 100% repeat-x;
  }
  .receipt-head{
    text-align:center;
    border-bottom:1px dashed var(--line);
    padding-bottom:18px; margin-bottom:26px;
  }
  .receipt-head .t{
    font-family:'Gowun Batang', serif; font-size:22px; color:var(--forest);
  }
  .receipt-head .n{
    font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-soft); margin-top:6px;
  }

  fieldset{
    border:none; margin:0 0 26px; padding:0;
  }
  legend{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--berry);
    letter-spacing:.06em;
    margin-bottom:10px;
    padding:0;
  }
  label.field-label{
    display:block;
    font-weight:600;
    font-size:14.5px;
    margin-bottom:8px;
    color:var(--ink);
  }
  .req::after{ content:" *"; color:var(--berry); }
  .hint{ font-size:12.5px; color:var(--ink-soft); margin:-4px 0 10px; }

  input[type=text], input[type=number], textarea{
    width:100%;
    font-family:'Noto Sans KR', sans-serif;
    font-size:14.5px;
    padding:11px 12px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--paper);
    color:var(--ink);
    transition:border-color .15s;
  }
  input:focus, textarea:focus{
    outline:none;
    border-color:var(--forest);
    background:#fff;
  }
  textarea{ resize:vertical; min-height:80px; }

  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:520px){ .row2{ grid-template-columns:1fr; } }

  /* radio / checkbox as receipt checklist */
  .opt-list{ display:flex; flex-direction:column; gap:8px; }
  .opt{
    display:flex; align-items:center; gap:10px;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    cursor:pointer;
    font-size:14px;
    background:var(--paper);
    transition:border-color .15s, background .15s;
  }
  .opt:hover{ border-color:var(--forest-2); }
  .opt input{ accent-color:var(--forest); width:16px; height:16px; flex:none; }
  .opt.checked{ border-color:var(--forest); background:var(--sage); }

  .sub-textarea{
    margin-top:10px;
    display:none;
  }
  .sub-textarea.show{ display:block; }

  button.submit{
    width:100%;
    background:var(--forest);
    color:var(--paper);
    border:none;
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
    letter-spacing:.04em;
    padding:15px;
    border-radius:var(--radius);
    cursor:pointer;
    margin-top:6px;
    transition:background .15s;
  }
  button.submit:hover{ background:var(--forest-2); }
  button.submit:disabled{ opacity:.55; cursor:not-allowed; }

  .status{
    margin-top:16px;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    padding:12px 14px;
    border-radius:var(--radius);
    display:none;
  }
  .status.show{ display:block; }
  .status.ok{ background:var(--sage); color:var(--forest); display:block; }
  .status.err{ background:#F4DEDD; color:var(--berry); display:block; }

  footer{ text-align:center; padding:0 24px 60px; }
  footer p{ font-size:12.5px; color:var(--ink-soft); }

  a{ color:inherit; }
  button:focus-visible, input:focus-visible, textarea:focus-visible{
    outline:2px solid var(--berry); outline-offset:2px;
  }
</style>
</head>
<body>

<header class="site">
  <div class="wrap" style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;">
    <div>
      <div class="eyebrow">Application · 2기 모집</div>
      <h1 class="brand">소분소분 지원서</h1>
      <p class="sub">한 주 반찬 걱정을 같이 줄여봐요. 아래 항목을 채워서 제출하면 지원이 완료됩니다.</p>
    </div>
    <nav class="top"><a href="archive.html">← 1기 아카이브 보기</a></nav>
  </div>
</header>

<main class="wrap">
  <div class="receipt">
    <div class="receipt-head">
      <div class="t">소분소분 2기 지원서</div>
      <div class="n">SOBUNSOBUN · MEAL PREP CLUB · APPLICATION FORM</div>
    </div>

    <form id="applyForm">

      <fieldset>
        <legend>01 — 기본 정보</legend>
        <div class="row2">
          <div>
            <label class="field-label req" for="name">이름</label>
            <input type="text" id="name" name="name" required placeholder="홍길동">
          </div>
          <div>
            <label class="field-label req" for="age">나이</label>
            <input type="number" id="age" name="age" required min="1" max="120" placeholder="23">
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>02 — 거주지</legend>
        <label class="field-label req" for="location">거주지 (모임 장소 조율용)</label>
        <div class="hint">동/역 단위로 편하게 적어주세요. 예: 관악구 신림동, 2호선 봉천역 근처</div>
        <input type="text" id="location" name="location" required placeholder="예: 관악구 신림동">
      </fieldset>

      <fieldset>
        <legend>03 — 자취 여부</legend>
        <label class="field-label req">현재 자취를 하고 계신가요?</label>
        <div class="opt-list" data-group="livingAlone">
          <label class="opt"><input type="radio" name="livingAlone" value="자취 중" required> 네, 자취 중이에요</label>
          <label class="opt"><input type="radio" name="livingAlone" value="자취 아님"> 아니요, 가족과 함께 살아요</label>
          <label class="opt"><input type="radio" name="livingAlone" value="자취 예정"> 곧 자취를 시작할 예정이에요</label>
        </div>
      </fieldset>

      <fieldset>
        <legend>04 — 지원 동기</legend>
        <label class="field-label req">동아리에 지원하는 이유 (해당하는 것 모두 선택)</label>
        <div class="opt-list" id="reasonGroup">
          <label class="opt"><input type="checkbox" name="reason" value="식비를 아끼고 싶어서"> 식비를 아끼고 싶어서</label>
          <label class="opt"><input type="checkbox" name="reason" value="요리가 재밌어서"> 요리가 재밌어서</label>
          <label class="opt"><input type="checkbox" name="reason" value="평소에 요리를 잘 해먹진 않지만 시도해보려고"> 평소에 요리를 잘 해먹진 않지만 시도해보려고</label>
          <label class="opt"><input type="checkbox" name="reason" value="밀프렙이 궁금해서"> 밀프렙이 궁금해서</label>
        </div>
      </fieldset>

      <fieldset>
        <legend>05 — 밀프렙 경험</legend>
        <label class="field-label req">밀프렙을 직접 만들어본 경험이 있나요?</label>
        <div class="opt-list" data-group="experience">
          <label class="opt"><input type="radio" name="experience" value="있음" required> 네, 만들어본 적 있어요</label>
          <label class="opt"><input type="radio" name="experience" value="없음"> 아니요, 처음이에요</label>
        </div>
        <textarea class="sub-textarea" id="experienceDetail" name="experienceDetail"
          placeholder="어떤 밀프렙을 만들어봤는지 간단히 알려주세요 (선택)"></textarea>
      </fieldset>

      <fieldset>
        <legend>06 — 기대하는 점</legend>
        <label class="field-label req" for="goal">소분소분에서 얻어가고 싶은 것은 무엇인가요?</label>
        <textarea id="goal" name="goal" required placeholder="예: 자취 요리 루틴을 만들고 같이 밥 먹을 사람들을 만나고 싶어요"></textarea>
      </fieldset>

      <button type="submit" class="submit" id="submitBtn">지원서 제출하기</button>
      <div class="status" id="statusBox"></div>
    </form>
  </div>
</main>

<footer>
  <p>제출한 정보는 2기 모임 구성과 장소 조율에만 사용돼요.</p>
</footer>

<script>
  // ===================================================================
  // ▼▼▼ 구글 스프레드시트 연동 설정 ▼▼▼
  // 1) 같이 첨부된 README.md의 안내대로 Google Apps Script를 배포하세요.
  // 2) 배포 후 생성되는 웹 앱 URL을 아래 큰따옴표 안에 붙여넣으세요.
  //    예: const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycb.../exec";
  // ===================================================================
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxAqfK9oQtZzXWwvGAANEDY5TbiENelQM3VU7v6q4WhtwbL_-bjY8SQwTfhrWeBrmw/exec";

  const form = document.getElementById('applyForm');
  const statusBox = document.getElementById('statusBox');
  const submitBtn = document.getElementById('submitBtn');

  // 체크된 옵션 카드에 하이라이트 스타일 적용
  document.querySelectorAll('.opt input').forEach(input => {
    const sync = () => {
      const group = input.closest('.opt-list');
      group.querySelectorAll('.opt').forEach(o => o.classList.remove('checked'));
      group.querySelectorAll('input:checked').forEach(c => c.closest('.opt').classList.add('checked'));
    };
    input.addEventListener('change', sync);
  });

  // 밀프렙 경험 "있음" 선택 시 상세 textarea 노출
  document.querySelectorAll('input[name="experience"]').forEach(r => {
    r.addEventListener('change', () => {
      const box = document.getElementById('experienceDetail');
      if (r.value === '있음' && r.checked) box.classList.add('show');
      else if (r.value === '없음' && r.checked) box.classList.remove('show');
    });
  });

  function showStatus(type, msg){
    statusBox.className = 'status show ' + type;
    statusBox.textContent = msg;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const reasons = Array.from(document.querySelectorAll('input[name="reason"]:checked')).map(c => c.value);
    if (reasons.length === 0){
      showStatus('err', '지원 동기를 하나 이상 선택해주세요.');
      return;
    }

    const payload = {
      timestamp: new Date().toISOString(),
      name: form.name.value.trim(),
      age: form.age.value,
      location: form.location.value.trim(),
      livingAlone: form.livingAlone.value,
      reason: reasons.join(', '),
      experience: form.experience.value,
      experienceDetail: form.experienceDetail.value.trim(),
      goal: form.goal.value.trim()
    };

    if (GOOGLE_SCRIPT_URL.includes('PASTE_YOUR')){
      showStatus('err', '⚠ 아직 스프레드시트 연결 주소가 설정되지 않았어요. README.md를 참고해 GOOGLE_SCRIPT_URL을 설정해주세요.');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = '제출 중...';

    try {
      // Apps Script 웹 앱은 CORS 프리플라이트를 피하기 위해
      // text/plain 으로 JSON 문자열을 보냅니다.
      await fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });

      // no-cors 모드에서는 응답 내용을 읽을 수 없어 성공으로 간주합니다.
      showStatus('ok', '제출 완료! 지원해주셔서 감사해요. 곧 연락드릴게요.');
      form.reset();
      document.querySelectorAll('.opt').forEach(o => o.classList.remove('checked'));
      document.getElementById('experienceDetail').classList.remove('show');
      submitBtn.textContent = '지원서 제출하기';
      submitBtn.disabled = false;

    } catch (err){
      showStatus('err', '제출 중 문제가 생겼어요. 잠시 후 다시 시도해주세요.');
      submitBtn.textContent = '지원서 제출하기';
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
